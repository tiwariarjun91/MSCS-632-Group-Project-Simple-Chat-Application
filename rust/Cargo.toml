[package]
name = "simple-chat-rust"
version = "0.1.0"
edition = "2024"
description = "Rust backend for the MSCS 632 Simple Chat Application"
publish = false

[dependencies]
# HTTP routes and JSON requests/responses for the shared browser interface.
axum = "0.8"

# Convert Rust structs to and from JSON.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async tasks, message-passing channels, HTTP listener, and graceful shutdown.
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "net", "signal"] }

# Serve the shared HTML, CSS, and JavaScript files from the backend.
tower-http = { version = "0.7", features = ["fs"] }
